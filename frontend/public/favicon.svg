<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#4f46e5"/>
  <!-- 机器人头 -->
  <rect x="8" y="12" width="16" height="10" rx="2" fill="#fff"/>
  <!-- 天线 -->
  <line x1="16" y1="12" x2="16" y2="8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="7" r="1.5" fill="#fff"/>
  <!-- 眼睛 -->
  <circle cx="12" cy="16.5" r="1.5" fill="#4f46e5"/>
  <circle cx="20" cy="16.5" r="1.5" fill="#4f46e5"/>
  <!-- 嘴巴 -->
  <line x1="13" y1="20" x2="19" y2="20" stroke="#4f46e5" stroke-width="1" stroke-linecap="round"/>
  <!-- 耳朵 -->
  <rect x="6" y="15" width="2.5" height="4" rx="1" fill="#fff"/>
  <rect x="23.5" y="15" width="2.5" height="4" rx="1" fill="#fff"/>
  <!-- 打勾 ✓ -->
  <polyline points="24,24 26,26 30,22" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
