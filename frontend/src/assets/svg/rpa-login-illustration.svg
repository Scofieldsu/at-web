<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b"/>
      <stop offset="100%" style="stop-color:#38f9d7"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- 底部圆环背景 -->
  <circle cx="340" cy="220" r="190" fill="none" stroke="url(#gBlue)" stroke-width="1" opacity="0.08"/>
  <circle cx="340" cy="220" r="150" fill="none" stroke="url(#gPink)" stroke-width="1" opacity="0.06"/>

  <!-- 机器人主体 -->
  <g transform="translate(340,200)">
    <!-- 天线 -->
    <line x1="0" y1="-75" x2="-5" y2="-95" stroke="url(#gBlue)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-5" cy="-98" r="4" fill="#f5576c" filter="url(#glow)"/>
    <line x1="0" y1="-75" x2="12" y2="-92" stroke="url(#gGreen)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="-95" r="3" fill="#43e97b" filter="url(#glow)"/>

    <!-- 头部 -->
    <rect x="-38" y="-72" width="76" height="60" rx="14" fill="#1e272e" stroke="#3d3d3d" stroke-width="1"/>
    <!-- 眼睛 -->
    <ellipse cx="-14" cy="-45" rx="9" ry="7" fill="#0d1117"/>
    <ellipse cx="14" cy="-45" rx="9" ry="7" fill="#0d1117"/>
    <circle cx="-14" cy="-45" r="4" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="14" cy="-45" r="4" fill="#00f2fe" filter="url(#glow)"/>

    <!-- 身体 -->
    <rect x="-30" y="-10" width="60" height="48" rx="8" fill="#1e272e"/>
    <!-- 胸口屏幕 -->
    <rect x="-18" y="-2" width="36" height="22" rx="4" fill="#0d1117"/>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="9" fill="#43e97b" font-weight="bold">RUNNING</text>
    <!-- 指示灯 -->
    <circle cx="0" cy="28" r="3" fill="#43e97b" filter="url(#glow)"/>

    <!-- 左臂 -->
    <g transform="translate(-36,2)">
      <rect x="-6" y="0" width="12" height="36" rx="5" fill="#1e272e"/>
      <circle cx="0" cy="40" r="6" fill="url(#gBlue)"/>
    </g>
    <!-- 右臂 -->
    <g transform="translate(36,2)">
      <rect x="-6" y="0" width="12" height="36" rx="5" fill="#1e272e"/>
      <circle cx="0" cy="40" r="6" fill="url(#gPink)"/>
    </g>
  </g>

  <!-- 齿轮组 -->
  <g transform="translate(155,330)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#gBlue)" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="23" fill="none" stroke="url(#gBlue)" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="url(#gBlue)" opacity="0.5"/>
    <g stroke="url(#gBlue)" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-36" x2="0" y2="-28"/><line x1="36" y1="0" x2="28" y2="0"/>
      <line x1="0" y1="36" x2="0" y2="28"/><line x1="-36" y1="0" x2="-28" y2="0"/>
    </g>
  </g>

  <g transform="translate(540,310)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#gPink)" stroke-width="2.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#gPink)" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="url(#gPink)" opacity="0.5"/>
    <g stroke="url(#gPink)" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-30" x2="0" y2="-22"/><line x1="30" y1="0" x2="22" y2="0"/>
      <line x1="0" y1="30" x2="0" y2="22"/><line x1="-30" y1="0" x2="-22" y2="0"/>
    </g>
  </g>

  <g transform="translate(550,120)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#gGreen)" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#gGreen)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="url(#gGreen)" opacity="0.5"/>
    <g stroke="url(#gGreen)" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-16"/><line x1="22" y1="0" x2="16" y2="0"/>
      <line x1="0" y1="22" x2="0" y2="16"/><line x1="-22" y1="0" x2="-16" y2="0"/>
    </g>
  </g>

  <!-- 数据连线 -->
  <g stroke="#4facfe" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.35">
    <path d="M187,330 Q220,300 270,285"/>
    <path d="M514,310 Q480,280 430,270"/>
    <path d="M532,120 Q490,145 440,168"/>
    <circle cx="270" cy="285" r="2.5" fill="#43e97b" filter="url(#glow)"/>
    <circle cx="430" cy="270" r="2.5" fill="#f5576c" filter="url(#glow)"/>
    <circle cx="440" cy="168" r="2" fill="#43e97b"/>
    <circle cx="340" cy="240" r="2.5" fill="#00f2fe" filter="url(#glow)"/>
  </g>

  <!-- 浮动数据圆点 -->
  <circle cx="255" cy="295" r="2" fill="#43e97b" opacity="0.6"/>
  <circle cx="445" cy="258" r="2" fill="#f093fb" opacity="0.6"/>
  <circle cx="300" cy="165" r="2" fill="#4facfe" opacity="0.6"/>

  <!-- 底部光晕 -->
  <ellipse cx="340" cy="405" rx="200" ry="8" fill="url(#gBlue)" opacity="0.06"/>
</svg>
